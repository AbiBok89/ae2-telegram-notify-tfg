name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: ae2telegramnotify-forge-1.20.1
          path: build/libs/*.jar

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          name: "${{ github.ref_name }} (TerraFirmaGreg-Modern / Forge 1.20.1)"
          body: |
            Мод **AE2 Telegram Notify** для **TerraFirmaGreg-Modern** (Minecraft 1.20.1, Forge 47.4.13, AE2 15.5.9-uelm).
            Положите `.jar` в папку `mods/` вашего сервера или клиента.
